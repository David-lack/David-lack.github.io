<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Science Chat</title>
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        header {
            background: #1e293b;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .user-message {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        footer {
            background: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 1px solid #334155;
            gap: 10px;
        }
        #status {
            font-size: 0.9rem;
            color: #94a3b8;
            height: 20px;
        }
        .huge-mic-btn {
            width: 90px;
            height: 90px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        .huge-mic-btn:active {
            transform: scale(0.95);
        }
        .huge-mic-btn.listening {
            background: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
            animation: pulse 1.5s infinite;
        }
        .huge-mic-btn svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>Science Voice Chat AI</header>

    <div id="chat-container">
        <div class="message ai-message">Hello! Tap the big red microphone button below and ask me a science question.</div>
    </div>

    <footer>
        <div id="status">Tap the microphone to speak</div>
        <button class="huge-mic-btn" id="micBtn" onclick="toggleListening()" title="Click to speak">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.39-.9.88 0 2.76-2.24 5-5 5s-5-2.24-5-5c0-.49-.41-.88-.9-.88s-.9.39-.9.88c0 3.19 2.45 5.82 5.5 6.27V21h2v-3.73c3.05-.45 5.5-3.08 5.5-6.27 0-.49-.41-.88-.9-.88z"/></svg>
        </button>
    </footer>

    <script>
        const GROQ_API_KEY = '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'; // Replace with your actual key
        const chatContainer = document.getElementById('chat-container');
        const statusEl = document.getElementById('status');
        const micBtn = document.getElementById('micBtn');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let isProcessing = false;

        if (!SpeechRecognition) {
            statusEl.innerText = "Speech recognition is not supported in this browser. Use Chrome.";
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            function toggleListening() {
                if (isProcessing) return;
                try {
                    window.speechSynthesis.cancel(); // Stop talking if interrupted
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                statusEl.innerText = "Listening... Speak now!";
            };

            recognition.onresult = async (event) => {
                const userSpeech = event.results[0][0].transcript;
                
                // Add user chat bubble
                appendMessage(userSpeech, 'user-message');
                
                isProcessing = true;
                statusEl.innerText = "Thinking...";
                micBtn.classList.remove('listening');

                await askGroq(userSpeech);
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                statusEl.innerText = "Error: " + event.error;
                isProcessing = false;
            };

            recognition.onend = () => {
                if (!isProcessing) {
                    micBtn.classList.remove('listening');
                    statusEl.innerText = "Tap the microphone to speak";
                }
            };

            async function askGroq(promptText) {
                try {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${GROQ_API_KEY}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama-3.3-70b-versatile",
                            messages: [
                                {
                                    role: "system",
                                    content: "You are a helpful science assistant. Answer questions about physics, chemistry, biology, space, and general science concisely (1-2 sentences). If the user asks something completely unrelated to science, reply with: 'That doesn't sound like a science question. Try asking me about physics or biology!'"
                                },
                                {
                                    role: "user",
                                    content: promptText
                                }
                            ]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.choices && data.choices.length > 0) {
                        const aiReply = data.choices[0].message.content;
                        appendMessage(aiReply, 'ai-message');
                        statusEl.innerText = "Speaking response...";
                        speakText(aiReply);
                    } else {
                        isProcessing = false;
                        statusEl.innerText = "Error getting AI response.";
                    }
                } catch (err) {
                    isProcessing = false;
                    statusEl.innerText = "Network error connecting to Groq.";
                    console.error(err);
                }
            }

            function appendMessage(text, className) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${className}`;
                messageDiv.innerText = text;
                chatContainer.appendChild(messageDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight; // Auto-scroll to bottom
            }

            function speakText(text) {
                const synth = window.speechSynthesis;
                synth.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                
                utterance.onend = () => {
                    isProcessing = false;
                    statusEl.innerText = "Tap the microphone to speak";
                };

                utterance.onerror = () => {
                    isProcessing = false;
                    statusEl.innerText = "Tap the microphone to speak";
                };

                synth.speak(utterance);
            }
        }
    </script>
</body>
</html>
